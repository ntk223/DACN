<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#334155">WORKSPACE SYNC — thành phần điều phối đồng bộ VFS ↔ Sandbox (design 01)</text>

  <!-- Row A: Agent → Gateway → Manager[WS] → System DB -->
  <rect x="60" y="80" width="170" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="145" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">AI AGENT</text>
  <text x="145" y="134" text-anchor="middle" font-size="10" fill="#64748b">chỉ biết session_id</text>

  <line x1="230" y1="118" x2="280" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="80" width="170" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="365" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">MCP GATEWAY</text>
  <text x="365" y="134" text-anchor="middle" font-size="10" fill="#64748b">resolve session → workspace</text>

  <line x1="450" y1="118" x2="510" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">REST nội bộ</text>

  <rect x="510" y="64" width="430" height="140" rx="10" fill="#fcfcfd" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="522" y="86" font-size="12" font-weight="700" fill="#334155">SANDBOX MANAGER</text>

  <rect x="530" y="96" width="250" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b45309">WORKSPACE SYNC</text>
  <text x="542" y="138" font-size="10" fill="#334155">materialize(workspace, volume)</text>
  <text x="542" y="156" font-size="10" fill="#334155">push(sandbox) · pull(sandbox)</text>
  <text x="542" y="174" font-size="10" fill="#334155">delta theo rev · 3-way classify · GC</text>

  <rect x="800" y="96" width="120" height="96" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="860" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">lifecycle</text>
  <text x="860" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">+ exec</text>
  <text x="860" y="160" text-anchor="middle" font-size="9" fill="#64748b">gọi WS ở đúng điểm</text>

  <line x1="940" y1="118" x2="990" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="965" y="108" text-anchor="middle" font-size="9.5" fill="#64748b">sync_state · ops</text>

  <rect x="990" y="80" width="230" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="1105" y="106" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">SYSTEM DB</text>
  <text x="1105" y="126" text-anchor="middle" font-size="10" fill="#64748b">data/system.sqlite</text>
  <text x="1105" y="144" text-anchor="middle" font-size="9.5" fill="#64748b">Manager sở hữu · ghi độc quyền</text>

  <!-- Row B: VFS | EXEC AGENT | CLOUD -->
  <path d="M 600 192 V 232 H 240 V 270" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="224" text-anchor="middle" font-size="10" fill="#475569">delta query · apply-delta (Tx-A)</text>

  <path d="M 680 192 V 230 H 725 V 270" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="800" y="224" text-anchor="middle" font-size="10" fill="#475569">gRPC SyncFiles / AgentManifest</text>

  <path d="M 760 192 V 244 H 1090 V 270" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="1000" y="238" text-anchor="middle" font-size="10" fill="#64748b">presigned GET / PUT</text>

  <rect x="60" y="270" width="360" height="120" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="75" y="294" font-size="12.5" font-weight="700" fill="#047857">VFS — WORKSPACE DB (mỗi dự án 1 file)</text>
  <text x="75" y="316" font-size="10" fill="#334155">data/workspaces/{id}.sqlite · WAL</text>
  <text x="75" y="336" font-size="10" fill="#334155">files · file_revisions · tombstones · workspace_meta</text>
  <text x="75" y="356" font-size="10" fill="#334155">VFS sở hữu · ghi độc quyền</text>
  <text x="75" y="376" font-size="9.5" font-style="italic" fill="#047857">chỉ file source — ignore rules cứng</text>

  <rect x="560" y="270" width="330" height="120" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="575" y="294" font-size="12.5" font-weight="700" fill="#b45309">EXEC AGENT (trong sandbox)</text>
  <text x="575" y="316" font-size="10" fill="#334155">gRPC: SyncFiles · AgentManifest</text>
  <text x="575" y="336" font-size="10" fill="#334155">ack per entry (path + sha256)</text>
  <text x="575" y="356" font-size="10" fill="#334155">scan /workspace — cache (mtime, size)</text>
  <text x="575" y="376" font-size="9.5" font-style="italic" fill="#b45309">không quyết conflict · không đụng VFS/cloud</text>

  <line x1="960" y1="330" x2="890" y2="330" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowGray)"/>
  <text x="925" y="318" text-anchor="middle" font-size="9.5" fill="#64748b">bytes trực tiếp</text>

  <rect x="960" y="270" width="260" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="975" y="294" font-size="12.5" font-weight="700" fill="#1d4ed8">CLOUD STORAGE</text>
  <text x="975" y="316" font-size="10" fill="#334155">presigned GET — prefetch pre-step</text>
  <text x="975" y="336" font-size="10" fill="#334155">presigned PUT — pull-back ≥ 2MB</text>
  <text x="975" y="356" font-size="10" fill="#334155">ChecksumSHA256 validate tại biên</text>
  <text x="975" y="376" font-size="9.5" font-style="italic" fill="#1d4ed8">key server-side · scope ngắn hạn</text>

  <!-- Row C: quy tắc -->
  <rect x="60" y="430" width="1160" height="250" rx="10" fill="#fcfcfd" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="454" font-size="12" font-weight="700" fill="#334155">QUY TẮC SỞ HỮU &amp; GIAO THỨC</text>

  <rect x="80" y="468" width="560" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="95" y="490" font-size="11.5" font-weight="700" fill="#334155">1 file SQLite = 1 process ghi độc quyền</text>
  <text x="95" y="512" font-size="10" fill="#475569">workspace DB ← VFS · system DB ← Sandbox Manager</text>
  <text x="95" y="530" font-size="10" fill="#475569">không tx xuyên file: Tx-A (dữ liệu) → Tx-B (registry)</text>
  <text x="95" y="548" font-size="10" fill="#475569">crash giữa 2 tx → re-execute idempotent (same-sha no-op)</text>

  <rect x="660" y="468" width="540" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="675" y="490" font-size="11.5" font-weight="700" fill="#334155">Watermark &amp; revision</text>
  <text x="675" y="512" font-size="10" fill="#475569">delta = files WHERE rev &gt; last_synced ∪ tombstones rev &gt; last_synced</text>
  <text x="675" y="530" font-size="10" fill="#475569">base phân loại 3 phía = synced_sha256 (per-file)</text>
  <text x="675" y="548" font-size="10" fill="#475569">watermark CHỈ advance tại push-ack Tx-B</text>

  <rect x="80" y="570" width="1120" height="88" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="95" y="594" font-size="11.5" font-weight="700" fill="#334155">Bất biến</text>
  <text x="95" y="616" font-size="10" fill="#475569">INV-1 watermark ≤ workspace_revision (suy ra — monotonic) · INV-2 file trong sandbox ⟺ VFS rev ≤ watermark</text>
  <text x="95" y="634" font-size="10" fill="#475569">INV-3 Tx-A workspace DB nguyên tử — không "nửa file"; Tx-B đi sau, idempotent</text>
  <text x="95" y="652" font-size="9.5" font-style="italic" fill="#94a3b8">chi tiết: docs/design/01-workspace-sync.md</text>
</svg>
