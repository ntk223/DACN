<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandbox Kit Clone — Bảng điều khiển W1</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --border-soft: #21262d;
    --text: #e6edf3;
    --dim: #9198a1;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --orange: #ffa657;
    --purple: #d2a8ff;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--mono); font-size: 13px; line-height: 1.45;
  }

  /* ------------------------------ Header ------------------------------ */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: #010409; position: sticky; top: 0; z-index: 10;
  }
  header .logo { font-size: 14px; font-weight: 700; color: var(--accent); }
  header .ver { color: var(--dim); font-size: 12px; }
  .resp-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

  /* ------------------------------ Badge ------------------------------ */
  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11px; border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
  }
  .badge-ok   { color: var(--green); border-color: var(--green); background: rgba(63,185,80,.12); }
  .badge-err  { color: var(--red); border-color: var(--red); background: rgba(248,81,73,.12); }
  .badge-net  { color: var(--orange); border-color: var(--orange); background: rgba(255,166,87,.12); }
  .badge-idle { color: var(--dim); }

  /* ------------------------------ Layout ------------------------------ */
  .layout {
    display: grid; grid-template-columns: 300px minmax(0, 1fr);
    gap: 12px; padding: 12px; align-items: start;
  }
  .sidebar {
    display: flex; flex-direction: column; gap: 12px;
    position: sticky; top: 56px;
    max-height: calc(100vh - 68px); overflow: auto;
  }
  main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 7px 12px; border-bottom: 1px solid var(--border-soft);
  }
  .panel-head h2 {
    margin: 0; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .panel-body { padding: 10px 12px; }
  .dim { color: var(--dim); }
  .small { font-size: 11.5px; }

  /* ------------------------------ Inputs & buttons ------------------------------ */
  input[type="text"], input[type="number"], textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-family: var(--mono); font-size: 12.5px;
  }
  textarea { min-height: 84px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: #1f6feb; }
  input[readonly] { color: var(--dim); background: #010409; }
  input[type="checkbox"] { width: auto; accent-color: #1f6feb; }
  input[type="file"] { color: var(--dim); font-size: 12px; }

  .btn {
    background: var(--border-soft); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 12px; cursor: pointer; font-family: var(--mono); font-size: 12px;
  }
  .btn:hover { background: var(--border); }
  .btn-primary { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .btn-primary:hover { background: #388bfd; }
  .btn.small { padding: 3px 9px; font-size: 11.5px; }

  /* ------------------------------ Sidebar ------------------------------ */
  .sfield { margin-bottom: 9px; }
  .sfield label { display: block; color: var(--dim); font-size: 11px; margin-bottom: 3px; }
  .group-label { color: #7d8590; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; margin: 10px 0 4px; }
  .group-label:first-child { margin-top: 0; }
  .tool-btn {
    display: block; width: 100%; text-align: left;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 6px;
    padding: 4px 8px; margin: 1px 0; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px;
  }
  .tool-btn:hover { background: var(--border-soft); }
  .tool-btn.active { background: rgba(31,111,235,.2); color: var(--accent); border-color: #1f6feb; }

  /* ------------------------------ Request form ------------------------------ */
  .req-title { font-size: 13px; font-weight: 700; }
  .req-desc { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; }
  .field {
    display: grid; grid-template-columns: 150px minmax(0, 1fr);
    gap: 8px; align-items: start; margin-bottom: 8px;
  }
  .field label { color: var(--dim); font-size: 12px; padding-top: 7px; }
  .field .bool-wrap { padding-top: 6px; }
  .warn {
    display: none; margin-top: 8px; color: var(--red);
    font-size: 12px; border: 1px solid rgba(248,81,73,.4);
    background: rgba(248,81,73,.08); border-radius: 6px; padding: 6px 9px;
  }

  /* ------------------------------ JSON viewer ------------------------------ */
  .json-view {
    padding: 10px 14px; overflow: auto; max-height: 46vh;
    font-size: 12.5px; line-height: 1.5; border-bottom: 1px solid var(--border-soft);
  }
  .json-view:empty { display: none; }
  .j-line { white-space: pre-wrap; word-break: break-all; }
  .j-children { margin-left: 7px; padding-left: 12px; border-left: 1px dotted var(--border); }
  .j-toggle { color: var(--accent); cursor: pointer; user-select: none; padding: 0 3px; }
  .j-key { color: #79c0ff; }                              /* key xanh duong */
  .j-key-err { color: var(--red); font-weight: 700; }     /* key "error" do */
  .j-str { color: #7ee787; }                              /* string xanh la */
  .j-num { color: var(--orange); }                        /* number cam */
  .j-bool, .j-null { color: var(--purple); }              /* bool/null do tim */
  .j-punct { color: #8b949e; }
  .j-note, .j-idx { color: #7d8590; }

  /* ------------------------------ Extras: bang / preview / progress ------------------------------ */
  .extras { border-top: 1px solid var(--border-soft); }
  .extras:empty { display: none; }
  .extra-block { margin-bottom: 10px; }
  .extra-title { color: var(--dim); font-size: 11.5px; margin-bottom: 6px; }
  .extra-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
  table.data { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.data th, table.data td { border: 1px solid var(--border-soft); padding: 4px 8px; text-align: left; }
  table.data th { background: var(--bg); color: var(--dim); font-weight: 600; }
  pre.preview {
    margin: 6px 0; padding: 8px 10px; background: var(--bg);
    border: 1px solid var(--border-soft); border-radius: 6px;
    overflow: auto; max-height: 300px; white-space: pre-wrap; word-break: break-word;
  }
  .pbar {
    height: 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin: 4px 0;
  }
  .pbar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #1f6feb, var(--green)); transition: width .12s; }
  .log {
    margin-top: 8px; padding: 6px 9px; background: var(--bg);
    border: 1px solid var(--border-soft); border-radius: 6px;
    max-height: 170px; overflow: auto; font-size: 11.5px; color: var(--dim);
  }
  .log div { white-space: pre-wrap; word-break: break-all; padding: 1px 0; }

  /* ------------------------------ History ------------------------------ */
  #history-body tr { cursor: pointer; }
  #history-body tr:hover { background: var(--border-soft); }
</style>
</head>
<body>

<header>
  <span class="logo">Sandbox Kit Clone — Bảng điều khiển W1</span>
  <span id="health-badge" class="badge badge-idle">…</span>
  <span id="health-version" class="ver">version —</span>
  <a href="/admin/vfs" style="margin-left:auto;color:var(--accent);font-size:12px">Quản lý VFS →</a>
</header>

<div class="layout">

  <!-- ============================ SIDEBAR ============================ -->
  <aside class="sidebar">

    <section class="panel">
      <div class="panel-head"><h2>State</h2></div>
      <div class="panel-body">
        <div class="sfield">
          <label>workspace_id</label>
          <input id="state-workspace" type="text" spellcheck="false" placeholder="tự điền sau workspace_create">
        </div>
        <div class="sfield">
          <label>session_id</label>
          <input id="state-session" type="text" spellcheck="false" placeholder="tự điền sau workspace_create">
        </div>
        <button id="btn-new-ws" class="btn">Tạo mới workspace</button>
        <div class="dim small" style="margin-top:8px">Mọi tool call lấy session_id từ khung này.</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>MCP Tools (13)</h2></div>
      <div class="panel-body" id="mcp-tools"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>REST</h2></div>
      <div class="panel-body" id="rest-items"></div>
    </section>

  </aside>

  <!-- ============================ MAIN ============================ -->
  <main>

    <section class="panel">
      <div class="panel-head">
        <h2>Request</h2>
        <span id="req-endpoint" class="dim small"></span>
      </div>
      <div class="panel-body">
        <div id="req-head"></div>
        <div id="req-form"></div>
        <div id="req-warn" class="warn"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Response</h2>
        <div class="resp-meta">
          <span id="resp-title" class="dim small"></span>
          <span id="resp-badge" class="badge badge-idle">—</span>
          <span id="resp-ms" class="dim small"></span>
          <button id="btn-copy-json" class="btn small">Copy JSON</button>
        </div>
      </div>
      <div id="resp-json" class="json-view"></div>
      <div id="resp-extra-top" class="panel-body extras"></div>
      <div id="resp-extra-bottom" class="panel-body extras"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>History</h2>
        <button id="btn-clear-history" class="btn small">Clear</button>
      </div>
      <div class="panel-body">
        <table class="data">
          <thead><tr><th>giờ</th><th>gọi</th><th>trạng thái</th><th>ms</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
        <div id="history-empty" class="dim small">Chưa có lượt gọi nào.</div>
      </div>
    </section>

  </main>
</div>

<script>
"use strict";
/* =====================================================================
 * Bảng điều khiển test API — vanilla JS, không build, không CDN.
 * - MCP: POST /mcp/ (JSON-RPC tools/call), parse được cả JSON thuần lẫn SSE.
 * - REST: upload theo phần (4MB/chunk, kèm X-Chunk-Sha256) + download.
 * - JSON viewer có màu + thu gọn; history 50 lượt gọi gần nhất.
 * Lưu ý an toàn: KHÔNG dùng innerHTML với dữ liệu trả về — mọi nội dung
 * động đều đi qua textContent (tránh XSS khi preview file).
 * ===================================================================== */

/* ------------------------------ Tiện ích DOM ------------------------------ */

const $id = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}

function fmtBytes(n) {
  if (typeof n !== "number" || Number.isNaN(n)) return "—";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(2) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}

function nowTime() {
  return new Date().toLocaleTimeString("vi-VN", { hour12: false });
}

function basename(p) {
  const parts = String(p).split("/");
  return parts[parts.length - 1] || "file";
}

async function copyText(text, btn) {
  let ok = false;
  try {
    await navigator.clipboard.writeText(text);
    ok = true;
  } catch (err) {
    // fallback cho môi trường không có clipboard API
    const ta = el("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch (err2) { ok = false; }
    ta.remove();
  }
  if (btn) {
    const old = btn.textContent;
    btn.textContent = ok ? "✓ Đã copy" : "✗ Lỗi copy";
    setTimeout(() => { btn.textContent = old; }, 1200);
  }
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = el("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function sha256Hex(buffer) {
  const digest = await crypto.subtle.digest("SHA-256", buffer);
  return Array.from(new Uint8Array(digest), (b) => b.toString(16).padStart(2, "0")).join("");
}

function base64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

/* ------------------------------ State chung ------------------------------ */

const state = { workspaceId: "", sessionId: "" };
const historyEntries = []; // tối đa 50 lượt gọi, mới nhất đứng đầu
let rpcId = 0;
let currentCopyPayload = "";
let currentSelection = null; // {kind:"tool", tool} hoặc {kind:"rest", id}

function applyStateToInputs() {
  $id("state-workspace").value = state.workspaceId;
  $id("state-session").value = state.sessionId;
  // đồng bộ các field session_id (readonly) trong form đang mở
  document.querySelectorAll("#req-form [data-state-key]").forEach((input) => {
    input.value = state[input.dataset.stateKey] || "";
  });
}

/* ------------------------------ Lớp fetch (timeout 30s + lỗi chuẩn) ------------------------------ */

class ApiError extends Error {
  constructor(code, message) {
    super(message);
    this.code = code;
  }
}

async function fetchWithTimeout(url, options, timeoutMs) {
  const opts = options || {};
  const limit = timeoutMs || 30000;
  const ctrl = new AbortController(); // mọi fetch đều có timeout (mặc định 30s)
  const timer = setTimeout(() => ctrl.abort(), limit);
  try {
    const merged = Object.assign({}, opts, { signal: ctrl.signal });
    return await fetch(url, merged);
  } catch (err) {
    const why = err && err.message ? err.message : String(err);
    throw new ApiError("MẠNG LỖI", "Không gọi được server (mạng lỗi hoặc quá " + Math.round(limit / 1000) + "s): " + why);
  } finally {
    clearTimeout(timer);
  }
}

async function parseErrorBody(res) {
  // Body lỗi HTTP là JSON payload chuẩn dạng {error:{code,message}}
  try { return await res.json(); } catch (err) { return null; }
}

async function postJSON(url, body) {
  const res = await fetchWithTimeout(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await parseErrorBody(res);
  if (!res.ok) {
    const code = data && data.error ? data.error.code : "HTTP " + res.status;
    const msg = data && data.error ? data.error.message : res.statusText;
    throw new ApiError(code, msg);
  }
  return data;
}

/* ------------------------------ Lớp MCP (JSON-RPC, parse JSON lẫn SSE) ------------------------------ */

function parseSsePayload(text) {
  // SSE: các dòng "data: {...}" — trả về object đầu tiên parse được (từ dưới lên)
  const lines = String(text).split("\n");
  for (let i = lines.length - 1; i >= 0; i--) {
    const line = lines[i].trim();
    if (line.startsWith("data:")) {
      const raw = line.slice(5).trim();
      if (raw) {
        try { return JSON.parse(raw); } catch (err) { /* thử dòng data: trước đó */ }
      }
    }
  }
  return null;
}

function extractToolResult(result) {
  // Kết quả tools/call: ưu tiên structuredContent, fallback parse content[0].text
  if (!result || typeof result !== "object") return result;
  if (result.structuredContent !== undefined) return result.structuredContent;
  if (Array.isArray(result.content)) {
    const first = result.content[0];
    if (first && typeof first.text === "string") {
      try { return JSON.parse(first.text); } catch (err) { return first.text; }
    }
  }
  return result;
}

async function callMcpTool(name, args) {
  rpcId += 1;
  const body = { jsonrpc: "2.0", id: rpcId, method: "tools/call", params: { name: name, arguments: args } };
  const res = await fetchWithTimeout("/mcp/", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
    body: JSON.stringify(body),
  });
  const text = await res.text();
  const ct = res.headers.get("content-type") || "";
  let payload = null;
  if (ct.indexOf("text/event-stream") !== -1) {
    payload = parseSsePayload(text); // server trả SSE (dòng "data: ...")
  } else {
    try { payload = JSON.parse(text); } catch (err) { payload = parseSsePayload(text); }
  }
  if (payload === null) {
    throw new ApiError("HTTP " + res.status, "Phản hồi không parse được (JSON/SSE): " + text.slice(0, 200));
  }
  if (payload.error) return { data: payload, isError: true }; // lỗi tầng JSON-RPC
  const result = payload.result !== undefined ? payload.result : payload;
  const data = extractToolResult(result);
  const isError = Boolean(data && typeof data === "object" && data.error); // lỗi nằm trong result (HTTP vẫn 200)
  return { data: data, isError: isError };
}

/* ------------------------------ Metadata 13 tool MCP ------------------------------ */
/* fields: {key,label,type:text|number|bool|textarea,def,required,state}
 * state=true → giá trị lấy từ STATE (readonly), không cho gõ trực tiếp. */

const SESSION_FIELD = { key: "session_id", label: "session_id", type: "text", state: true, required: true };

const TOOLS = [
  {
    name: "workspace_create", group: "Workspace", desc: "Tạo workspace + phiên làm việc mới (sinh mã tự động)",
    fields: [
      { key: "name", label: "name", type: "text", def: "", required: false },
      { key: "conflict_policy", label: "conflict_policy", type: "select", options: ["sandbox_wins", "error"], def: "sandbox_wins", required: false },
    ],
  },
  {
    name: "sandbox_start", group: "Sandbox", desc: "Chạy sandbox cho phiên (STANDBY → RUNNING)",
    fields: [
      SESSION_FIELD,
      { key: "ttl_seconds", label: "ttl_seconds", type: "number", def: 3600, required: false },
      { key: "cpu", label: "cpu (tùy chọn)", type: "number", required: false },
      { key: "memory", label: "memory (tùy chọn)", type: "number", required: false },
    ],
  },
  { name: "sandbox_stop", group: "Sandbox", desc: "Hủy sandbox của phiên (→ STANDBY)", fields: [SESSION_FIELD] },
  { name: "sandbox_pause", group: "Sandbox", desc: "Tạm dừng sandbox đang RUNNING (→ PAUSED)", fields: [SESSION_FIELD] },
  { name: "sandbox_resume", group: "Sandbox", desc: "Tiếp tục sandbox đang PAUSED (→ RUNNING)", fields: [SESSION_FIELD] },
  {
    name: "sandbox_renew", group: "Sandbox", desc: "Gia hạn thời hạn sống của sandbox",
    fields: [SESSION_FIELD, { key: "ttl_seconds", label: "ttl_seconds", type: "number", def: 3600, required: true }],
  },
  { name: "sandbox_status", group: "Sandbox", desc: "Xem trạng thái phiên + sandbox", fields: [SESSION_FIELD] },
  {
    name: "file_write", group: "Files", desc: "Ghi file (≤ ~3MB — quá hạn dùng Upload REST bên dưới)",
    fields: [
      SESSION_FIELD,
      { key: "path", label: "path", type: "text", def: "docs/ghi.txt", required: true },
      { key: "content", label: "content", type: "textarea", def: "Xin chào từ admin UI\n", required: true },
    ],
  },
  { name: "file_read", group: "Files", desc: "Đọc file: text/base64, hoặc download_url nếu file lớn", fields: [SESSION_FIELD, { key: "path", label: "path", type: "text", def: "", required: true }] },
  {
    name: "file_edit", group: "Files", desc: "Thay old_text → new_text (khớp chính xác rồi khớp mờ)",
    fields: [
      SESSION_FIELD,
      { key: "path", label: "path", type: "text", def: "", required: true },
      { key: "old_text", label: "old_text", type: "textarea", def: "", required: true },
      { key: "new_text", label: "new_text", type: "textarea", def: "", required: true },
    ],
  },
  { name: "file_delete", group: "Files", desc: "Xóa file khỏi kho (còn tombstone)", fields: [SESSION_FIELD, { key: "path", label: "path", type: "text", def: "", required: true }] },
  { name: "file_list", group: "Files", desc: "Liệt kê toàn bộ file trong kho", fields: [SESSION_FIELD] },
  { name: "sync_status", group: "Sync", desc: "Trạng thái đồng bộ kho ↔ sandbox", fields: [SESSION_FIELD] },
];

const REST_ENDPOINTS = [
  { id: "upload", label: "upload file lớn (REST)", desc: "POST /upload → PUT từng chunk 4MB → POST complete" },
  { id: "download", label: "download file (REST)", desc: "GET /download/{workspace_id}?path=…" },
];

/* ------------------------------ Sidebar ------------------------------ */

function buildSidebar() {
  const mcpBox = $id("mcp-tools");
  const groups = [];
  for (const t of TOOLS) {
    let g = null;
    for (const x of groups) { if (x.name === t.group) g = x; }
    if (!g) { g = { name: t.group, tools: [] }; groups.push(g); }
    g.tools.push(t);
  }
  for (const g of groups) {
    mcpBox.appendChild(el("div", "group-label", "▸ " + g.name));
    for (const t of g.tools) {
      const b = el("button", "tool-btn", t.name);
      b.title = t.desc;
      b.dataset.tool = t.name;
      b.addEventListener("click", () => selectTool(t));
      mcpBox.appendChild(b);
    }
  }
  const restBox = $id("rest-items");
  for (const r of REST_ENDPOINTS) {
    const b = el("button", "tool-btn", r.label);
    b.title = r.desc;
    b.dataset.rest = r.id;
    b.addEventListener("click", () => selectRest(r));
    restBox.appendChild(b);
  }
}

function markActive() {
  document.querySelectorAll(".tool-btn").forEach((b) => b.classList.remove("active"));
  if (!currentSelection) return;
  let sel = null;
  if (currentSelection.kind === "tool") {
    sel = document.querySelector('[data-tool="' + currentSelection.tool.name + '"]');
  } else {
    sel = document.querySelector('[data-rest="' + currentSelection.id + '"]');
  }
  if (sel) sel.classList.add("active");
}

/* ------------------------------ Form REQUEST sinh động ------------------------------ */

function setReqTitle(title, desc) {
  const box = $id("req-head");
  box.replaceChildren();
  box.appendChild(el("div", "req-title", title));
  if (desc) box.appendChild(el("div", "req-desc", desc));
}

function warnReq(msg) {
  const w = $id("req-warn");
  w.textContent = "⚠ " + msg;
  w.style.display = "block";
}

function clearReqWarn() {
  const w = $id("req-warn");
  w.textContent = "";
  w.style.display = "none";
}

function buildField(f) {
  const row = el("div", "field");
  row.appendChild(el("label", null, f.label + (f.required ? " *" : "")));
  let input;
  if (f.type === "textarea") {
    input = el("textarea");
    input.rows = 4;
  } else if (f.type === "bool") {
    input = el("input");
    input.type = "checkbox";
    input.checked = Boolean(f.def);
  } else if (f.type === "number") {
    input = el("input");
    input.type = "number";
  } else if (f.type === "select") {
    input = el("select");
    for (const opt of f.options || []) {
      const o = el("option");
      o.value = opt; o.textContent = opt;
      input.appendChild(o);
    }
  } else if (f.type === "file") {
    input = el("input");
    input.type = "file";
  } else {
    input = el("input");
    input.type = "text";
  }
  input.dataset.key = f.key;
  if (f.state) {
    input.dataset.stateKey = "sessionId";
    input.readOnly = true;
    input.value = state.sessionId;
    input.title = "Lấy tự động từ STATE — bấm “Tạo mới workspace” để có session_id";
  } else if (f.def !== undefined) {
    input.value = String(f.def);
  }
  if (f.type === "bool") {
    const wrap = el("span", "bool-wrap");
    wrap.appendChild(input);
    row.appendChild(wrap);
  } else {
    row.appendChild(input);
  }
  return row;
}

function selectTool(tool) {
  currentSelection = { kind: "tool", tool: tool };
  markActive();
  clearReqWarn();
  setReqTitle("MCP tool: " + tool.name, tool.desc);
  $id("req-endpoint").textContent = "POST /mcp/ · tools/call → " + tool.name;
  const form = $id("req-form");
  form.replaceChildren();
  for (const f of tool.fields) form.appendChild(buildField(f));
  const send = el("button", "btn btn-primary", "Gửi");
  send.addEventListener("click", () => sendTool(tool));
  form.appendChild(send);
}

function selectRest(r) {
  currentSelection = { kind: "rest", id: r.id };
  markActive();
  clearReqWarn();
  const form = $id("req-form");
  form.replaceChildren();
  if (r.id === "upload") {

    $id("req-endpoint").textContent = "POST /upload → PUT /upload/{token}?chunk=N → POST …/complete";
    const fileRow = buildField({ key: "__file", label: "file", type: "file", required: true });

    form.appendChild(fileRow);
    form.appendChild(pathRow);

    });

/* ------------------------------ Gửi tool ------------------------------ */

async function runToolCall(toolName, args) {
  const t0 = performance.now();
  try {
    const out = await callMcpTool(toolName, args);
    const ms = Math.round(performance.now() - t0);
    const kind = out.isError ? "error" : "ok";
    showResponse({ tool: toolName, kind: kind, data: out.data, ms: ms });
    pushHistory({ tool: toolName, kind: kind, data: out.data, ms: ms });
    return out.data;
  } catch (err) {
    const ms = Math.round(performance.now() - t0);
    const data = { error: { code: err.code || "network_error", message: err.message } };
    const kind = err.code === "MẠNG LỖI" ? "network" : "error";
    showResponse({ tool: toolName, kind: kind, data: data, ms: ms });
    pushHistory({ tool: toolName, kind: "network", data: data, ms: ms });
    return null;
  }
}

async function sendTool(tool) {
  clearReqWarn();
  const form = $id("req-form");
  const args = {};
  let missingSession = false;
  for (const f of tool.fields) {
    const input = form.querySelector('[data-key="' + f.key + '"]');
    if (!input) continue;
    if (f.state) {
      const sid = state.sessionId.trim();
      if (!sid) { missingSession = true; continue; }
      args[f.key] = sid; // session_id LUÔN lấy từ STATE
      continue;
    }
    if (f.type === "bool") { args[f.key] = input.checked; continue; }
    const raw = input.value;
    if (f.type === "number") {
      if (raw.trim() === "") continue; // bỏ trống → không gửi, server dùng default
      const n = Number(raw);
      if (!Number.isNaN(n)) args[f.key] = n;
      continue;
    }
    args[f.key] = raw; // text/textarea — gửi cả chuỗi rỗng (đúng contract default)
  }
  if (missingSession) {
    warnReq("session_id trong STATE đang trống — bấm “Tạo mới workspace” ở khung STATE (hoặc dán session_id vào đó) rồi gọi lại.");
    return;
  }
  const data = await runToolCall(tool.name, args);
  if (tool.name === "workspace_create" && data && data.workspace_id) {
    // Tự điền STATE sau khi tạo workspace thành công
    state.workspaceId = data.workspace_id;
    state.sessionId = data.session_id;
    applyStateToInputs();
  }
}

async function createWorkspaceShortcut() {
  clearReqWarn();
  const data = await runToolCall("workspace_create", { name: "" });
  if (data && data.workspace_id) {
    state.workspaceId = data.workspace_id;
    state.sessionId = data.session_id;
    applyStateToInputs();
  }
}

/* ------------------------------ JSON viewer (có màu + thu gọn) ------------------------------ */

const JSON_MAX_OPEN_DEPTH = 2; // mặc định mở 2 cấp

function scalarSpan(value) {
  if (value === null) return el("span", "j-null", "null");
  if (typeof value === "string") return el("span", "j-str", JSON.stringify(value));
  if (typeof value === "number") return el("span", "j-num", String(value));
  if (typeof value === "boolean") return el("span", "j-bool", String(value));
  return el("span", "j-str", String(value));
}

function jsonNode(key, value, depth, isIndex) {
  const node = el("div", "j-node");
  const head = el("div", "j-line");
  if (key !== null && key !== undefined) {
    const kspan = isIndex
      ? el("span", "j-idx", key)
      : el("span", key === "error" ? "j-key j-key-err" : "j-key", JSON.stringify(key));
    head.appendChild(kspan);
    head.appendChild(el("span", "j-punct", ": "));
  }
  if (value === null || typeof value !== "object") {
    head.appendChild(scalarSpan(value));
    node.appendChild(head);
    return node;
  }
  const isArray = Array.isArray(value);
  const entries = isArray ? value.map((v, i) => [String(i), v]) : Object.entries(value);
  const openB = isArray ? "[" : "{";
  const closeB = isArray ? "]" : "}";
  if (entries.length === 0) {
    head.appendChild(el("span", "j-punct", openB + closeB));
    node.appendChild(head);
    return node;
  }
  const toggle = el("span", "j-toggle", "▾");
  head.appendChild(toggle);
  head.appendChild(el("span", "j-punct", openB));
  const note = el("span", "j-note", " " + entries.length + " " + (isArray ? "phần tử " : "khóa ") + closeB);
  head.appendChild(note);
  node.appendChild(head);
  const children = el("div", "j-children");
  for (const pair of entries) {
    children.appendChild(jsonNode(isArray ? null : pair[0], pair[1], depth + 1, isArray));
  }
  node.appendChild(children);
  const closeLine = el("div", "j-line j-close", closeB);
  node.appendChild(closeLine);
  let open = depth < JSON_MAX_OPEN_DEPTH;
  const apply = () => {
    children.style.display = open ? "block" : "none";
    closeLine.style.display = open ? "block" : "none";
    note.style.display = open ? "none" : "inline";
    toggle.textContent = open ? "▾" : "▸";
  };
  toggle.addEventListener("click", () => { open = !open; apply(); });
  apply();
  return node;
}

function safeJsonStringify(value) {
  try { return JSON.stringify(value, null, 2); } catch (err) { return String(value); }
}

/* ------------------------------ Panel RESPONSE + extras ------------------------------ */

function setBadge(kind) {
  const b = $id("resp-badge");
  if (kind === "ok") { b.className = "badge badge-ok"; b.textContent = "OK"; }
  else if (kind === "network") { b.className = "badge badge-net"; b.textContent = "MẠNG LỖI"; }
  else if (kind === "busy") { b.className = "badge badge-idle"; b.textContent = "ĐANG CHẠY…"; }
  else { b.className = "badge badge-err"; b.textContent = "LỖI"; }
}

function showResponse(entry, opts) {
  const options = opts || {};
  $id("resp-title").textContent = entry.tool || "";
  setBadge(entry.kind);
  $id("resp-ms").textContent = entry.ms !== undefined ? entry.ms + " ms" : "";
  const jsonBox = $id("resp-json");
  jsonBox.replaceChildren();
  if (entry.data !== undefined) jsonBox.appendChild(jsonNode(null, entry.data, 0, false));
  renderExtras(entry, options);
  currentCopyPayload = safeJsonStringify(entry.data);
}

function renderExtras(entry, opts) {
  const options = opts || {};
  const top = $id("resp-extra-top");
  const bottom = $id("resp-extra-bottom");
  if (!options.keepTop) top.replaceChildren(); // giữ progress khi upload đang chạy
  bottom.replaceChildren();
  const data = entry.data;
  if (!data || typeof data !== "object") return;
  if (entry.tool === "file_list" && Array.isArray(data.files)) {
    bottom.appendChild(buildFileTable(data.files));
  }
  if (entry.tool === "file_read") {
    const box = buildFileReadExtras(data);
    if (box) bottom.appendChild(box);
  }
}

function buildFileTable(files) {
  const wrap = el("div", "extra-block");
  wrap.appendChild(el("div", "extra-title", "file_list — " + files.length + " file"));
  if (files.length === 0) {
    wrap.appendChild(el("div", "dim small", "Kho trống."));
    return wrap;
  }
  const table = el("table", "data");
  const thead = el("thead");
  const hr = el("tr");
  ["path", "size", "rev", "storage_class", "is_binary"].forEach((h) => hr.appendChild(el("th", null, h)));
  thead.appendChild(hr);
  table.appendChild(thead);
  const tbody = el("tbody");
  for (const f of files) {
    const tr = el("tr");
    tr.appendChild(el("td", null, f.path !== undefined ? f.path : "—"));
    tr.appendChild(el("td", null, fmtBytes(f.size) + " (" + f.size + " B)"));
    tr.appendChild(el("td", null, f.rev !== undefined ? f.rev : "—"));
    tr.appendChild(el("td", null, f.storage_class !== undefined ? f.storage_class : "—"));
    tr.appendChild(el("td", null, f.is_binary !== undefined ? f.is_binary : "—"));
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function buildFileReadExtras(data) {
  const box = el("div", "extra-block");
  if (typeof data.content === "string" && data.encoding === "base64") {
    // File binary: hiện kích thước + nút tải xuống (decode base64 → Blob)
    const bytes = base64ToBytes(data.content);
    const row = el("div", "extra-row");
    row.appendChild(el("span", null, "binary (" + bytes.length + " bytes, base64)"));
    const btn = el("button", "btn small", "Tải xuống");
    btn.addEventListener("click", () => saveBlob(new Blob([bytes]), "file"));
    row.appendChild(btn);
    box.appendChild(row);
    return box;
  }
  if (typeof data.content === "string") {
    // File text: khối pre riêng, có thể copy (textContent — an toàn XSS)
    box.appendChild(el("div", "extra-title", "Nội dung file (" + fmtBytes(data.size) + "):"));
    const pre = el("pre", "preview");
    pre.textContent = data.content;
    box.appendChild(pre);
    const btn = el("button", "btn small", "Copy nội dung");
    btn.addEventListener("click", () => copyText(data.content, btn));
    box.appendChild(btn);
    return box;
  }
  if (typeof data.download_url === "string") {
    // File lớn (≥ ngưỡng inline): tải qua đường REST bằng fetch blob
    box.appendChild(el("div", "extra-title", "File lớn (≥ ngưỡng inline) — tải qua đường REST:"));
    const row = el("div", "extra-row");
    const detail = data.download_url + " · " + fmtBytes(data.size) + " · sha256=" + String(data.sha256 || "—").slice(0, 16) + "…";
    row.appendChild(el("span", "dim small", detail));
    const btn = el("button", "btn small", "Mở tải xuống");
    btn.addEventListener("click", async () => {
      try {
        const res = await fetchWithTimeout(data.download_url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const buf = await res.arrayBuffer();
        let fname = "file";
        try {
          const p = new URL(data.download_url, location.origin).searchParams.get("path");
          if (p) fname = basename(p);
        } catch (err2) { fname = "file"; }
        saveBlob(new Blob([buf]), fname);
      } catch (err) {
        btn.textContent = "✗ " + err.message;
      }
    });
    row.appendChild(btn);
    box.appendChild(row);
    return box;
  }
  return null;
}

/* ------------------------------ Upload REST theo phần ------------------------------ */

function startProgressView(title) {
  $id("resp-title").textContent = title;
  setBadge("busy");
  $id("resp-ms").textContent = "";
  $id("resp-json").replaceChildren();
  $id("resp-extra-bottom").replaceChildren();
  const top = $id("resp-extra-top");
  top.replaceChildren();
  const bar = el("div", "pbar");
  const fill = el("div", "pbar-fill");
  bar.appendChild(fill);
  const pct = el("div", "dim small", "0%");
  const log = el("div", "log");
  top.append(bar, pct, log);
  return {
    setProgress: (done, total) => {
      const p = total > 0 ? Math.round((done / total) * 100) : 100;
      fill.style.width = p + "%";
      pct.textContent = p + "% (" + fmtBytes(done) + " / " + fmtBytes(total) + ")";
    },
    logLine: (text) => {
      log.appendChild(el("div", null, text));
      log.scrollTop = log.scrollHeight;
    },
  };
}

async function runUpload() {
  clearReqWarn();
  const form = $id("req-form");
  const fileInput = form.querySelector('input[type="file"]');
  const pathInput = form.querySelector('[data-key="path"]');
  const file = fileInput && fileInput.files ? fileInput.files[0] : null;
  const destPath = pathInput ? pathInput.value.trim() : "";
  const ws = state.workspaceId.trim();
  if (!file) { warnReq("Chưa chọn tệp để upload."); return; }
  if (!destPath) { warnReq("Chưa điền path đích trong kho."); return; }
  if (!ws) { warnReq("workspace_id trong STATE đang trống — bấm “Tạo mới workspace” trước."); return; }
  const view = startProgressView("upload (REST): " + destPath);
  const t0 = performance.now();
  try {
    view.setProgress(0, file.size);
    view.logLine("POST /upload · " + file.name + " → " + destPath + " (" + fmtBytes(file.size) + ")");
    const init = await postJSON("/upload", { workspace_id: ws, path: destPath, size: file.size });
    if (init && init.error) throw new ApiError(init.error.code || "upload_error", init.error.message || "POST /upload thất bại");
    const token = init.token;
    const chunkSize = init.chunk_size || 4194304; // dùng chunk_size server trả về
    const total = Math.ceil(file.size / chunkSize);
    view.logLine("token=" + token + " · chunk_size=" + fmtBytes(chunkSize) + " · " + total + " chunk");
    for (let i = 0; i < total; i++) {
      // File.slice() — không load cả file vào RAM
      const blob = file.slice(i * chunkSize, Math.min((i + 1) * chunkSize, file.size));
      const buf = await blob.arrayBuffer();
      const sha = await sha256Hex(buf); // X-Chunk-Sha256 cho từng chunk
      const res = await fetchWithTimeout("/upload/" + encodeURIComponent(token) + "?chunk=" + i, {
        method: "PUT",
        headers: { "X-Chunk-Sha256": sha },
        body: buf,
      });
      if (!res.ok) {
        const payload = await parseErrorBody(res);
        const code = payload && payload.error ? payload.error.code : "HTTP " + res.status;
        const msg = payload && payload.error ? payload.error.message : "PUT chunk " + i + " thất bại";
        throw new ApiError(code, msg);
      }
      view.logLine("chunk " + i + " ✓ " + fmtBytes(buf.byteLength) + " · sha256=" + sha.slice(0, 16) + "…");
      view.setProgress(Math.min((i + 1) * chunkSize, file.size), file.size);
    }
    view.logLine("POST /upload/" + token + "/complete …");
    const done = await postJSON("/upload/" + encodeURIComponent(token) + "/complete", {});
    if (done && done.error) throw new ApiError(done.error.code || "upload_error", done.error.message || "complete thất bại");
    const ms = Math.round(performance.now() - t0);
    view.setProgress(file.size, file.size);
    view.logLine("hoàn tất · storage=" + done.storage + " · sha256=" + done.sha256 + " · size=" + done.size + " · rev=" + done.rev);
    const badgeText = done.storage === "blob" ? "vào file rời (blob)" : "trong DB (vfs)";
    showResponse({ tool: "upload (REST)", kind: "ok", data: done, ms: ms }, { keepTop: true });
    $id("resp-extra-bottom").appendChild(el("span", "badge badge-ok", badgeText));
    pushHistory({ tool: "upload (REST)", kind: "ok", data: done, ms: ms });
  } catch (err) {
    const ms = Math.round(performance.now() - t0);
    const data = { error: { code: err.code || "upload_error", message: err.message } };
    const kind = err.code === "MẠNG LỖI" ? "network" : "error";
    showResponse({ tool: "upload (REST)", kind: kind, data: data, ms: ms }, { keepTop: true });
    pushHistory({ tool: "upload (REST)", kind: "network", data: data, ms: ms });
  }
}

/* ------------------------------ Download REST ------------------------------ */

async function runDownload() {
  clearReqWarn();
  const form = $id("req-form");
  const pathInput = form.querySelector('[data-key="path"]');
  const path = pathInput ? pathInput.value.trim() : "";
  const ws = state.workspaceId.trim();
  if (!path) { warnReq("Chưa điền path cần tải."); return; }
  if (!ws) { warnReq("workspace_id trong STATE đang trống — bấm “Tạo mới workspace” trước."); return; }
  const t0 = performance.now();
  try {
    const res = await fetchWithTimeout("/download/" + encodeURIComponent(ws) + "?path=" + encodeURIComponent(path));
    const ct = res.headers.get("content-type") || "";
    if (!res.ok || ct.indexOf("application/json") !== -1) {
      // Lỗi trả JSON payload chuẩn {error:{code,message}}
      const payload = await parseErrorBody(res);
      const data = payload || { error: { code: "HTTP " + res.status, message: res.statusText } };
      const ms = Math.round(performance.now() - t0);
      showResponse({ tool: "download (REST)", kind: "error", data: data, ms: ms });
      pushHistory({ tool: "download (REST)", kind: "error", data: data, ms: ms });
      return;
    }
    const buf = await res.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const binary = bytes.includes(0); // có byte NUL → coi là binary
    const info = {
      path: path,
      content_type: ct,
      size: bytes.length,
      sha256: res.headers.get("x-file-sha256"),
      is_binary: binary ? 1 : 0,
    };
    const ms = Math.round(performance.now() - t0);
    showResponse({ tool: "download (REST)", kind: "ok", data: info, ms: ms });
    const bottom = $id("resp-extra-bottom");
    const row = el("div", "extra-row");
    const dlBtn = el("button", "btn", "Tải về");
    dlBtn.addEventListener("click", () => saveBlob(new Blob([buf]), basename(path)));
    row.appendChild(dlBtn);
    row.appendChild(el("span", "dim small", fmtBytes(bytes.length) + (binary ? " · binary (phát hiện byte NUL)" : " · text")));
    bottom.appendChild(row);
    if (!binary && bytes.length <= 1048576) {
      const pre = el("pre", "preview");
      pre.textContent = new TextDecoder("utf-8").decode(bytes); // textContent — an toàn XSS
      bottom.appendChild(pre);
    } else {
      bottom.appendChild(el("div", "dim small", binary ? "Không xem trước nội dung binary." : "File text > 1MB — không xem trước, dùng nút “Tải về”."));
    }
    pushHistory({ tool: "download (REST)", kind: "ok", data: info, ms: ms });
  } catch (err) {
    const ms = Math.round(performance.now() - t0);
    const data = { error: { code: err.code || "network_error", message: err.message } };
    const kind = err.code === "MẠNG LỖI" ? "network" : "error";
    showResponse({ tool: "download (REST)", kind: kind, data: data, ms: ms });
    pushHistory({ tool: "download (REST)", kind: "network", data: data, ms: ms });
  }
}

/* ------------------------------ History (tối đa 50) ------------------------------ */

function pushHistory(entry) {
  entry.time = nowTime();
  historyEntries.unshift(entry);
  if (historyEntries.length > 50) historyEntries.length = 50;
  renderHistory();
}

function renderHistory() {
  const tbody = $id("history-body");
  tbody.replaceChildren();
  $id("history-empty").style.display = historyEntries.length ? "none" : "block";
  for (const entry of historyEntries) {
    const tr = el("tr");
    tr.title = "Bấm để xem lại response";
    tr.appendChild(el("td", null, entry.time));
    tr.appendChild(el("td", null, entry.tool));
    const td = el("td");
    const cls = entry.kind === "ok" ? "badge badge-ok" : (entry.kind === "network" ? "badge badge-net" : "badge badge-err");
    const label = entry.kind === "ok" ? "OK" : (entry.kind === "network" ? "MẠNG LỖI" : "LỖI");
    td.appendChild(el("span", cls, label));
    tr.appendChild(td);
    tr.appendChild(el("td", null, entry.ms !== undefined ? entry.ms : "—"));
    tr.addEventListener("click", () => showResponse(entry));
    tbody.appendChild(tr);
  }
}

function clearHistory() {
  historyEntries.length = 0;
  renderHistory();
}

/* ------------------------------ Health badge (poll 5s) ------------------------------ */

async function pollHealth() {
  const badge = $id("health-badge");
  const ver = $id("health-version");
  try {
    const res = await fetchWithTimeout("/health", {}, 5000);
    const data = await res.json();
    badge.className = "badge badge-ok";
    badge.textContent = "ĐẠT";
    ver.textContent = "version " + (data.version || "?");
  } catch (err) {
    badge.className = "badge badge-err";
    badge.textContent = "MẤT";
    ver.textContent = "version —";
  }
}

/* ------------------------------ Khởi động ------------------------------ */

function init() {
  buildSidebar();
  $id("state-workspace").addEventListener("input", (e) => { state.workspaceId = e.target.value.trim(); });
  $id("state-session").addEventListener("input", (e) => { state.sessionId = e.target.value.trim(); });
  $id("btn-new-ws").addEventListener("click", createWorkspaceShortcut);
  $id("btn-copy-json").addEventListener("click", () => copyText(currentCopyPayload, $id("btn-copy-json")));
  $id("btn-clear-history").addEventListener("click", clearHistory);
  selectTool(TOOLS[0]); // mở sẵn workspace_create
  pollHealth();
  setInterval(pollHealth, 5000);
}

init();
</script>
