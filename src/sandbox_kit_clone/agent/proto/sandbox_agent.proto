// Giao thức Manager ↔ trình thực thi trong sandbox (mcp-integration §3.9).
// W2: Exec, SyncFiles (nhận file + xác nhận từng file), ListFiles (danh sách + sha256), Healthcheck.
// W3: PullFiles (pull-back: nhận nội dung file từ sandbox về kho).
syntax = "proto3";

package sandbox_kit.agent.v1;

service ExecAgent {
  // Chạy một lệnh shell; trả output theo từng đoạn, sự kiện cuối là Exit.
  rpc Exec(ExecRequest) returns (stream ExecEvent);
  // Agent còn sống và sẵn sàng nhận lệnh.
  rpc Healthcheck(HealthRequest) returns (HealthReply);
  // Nhận một loạt thao tác file: mỗi file = FileStart, các đoạn data, FileEnd; xóa = Delete.
  // Ghi ra file tạm → kiểm sha256 → đổi tên (nguyên tử). Trả xác nhận cho TỪNG thao tác.
  rpc SyncFiles(stream SyncMessage) returns (SyncReply);
  // Liệt kê file trong workspace (bỏ qua các thư mục trong exclude_dirs).
  rpc ListFiles(ListRequest) returns (stream FileEntry);
  // Nhận nội dung file từ sandbox về kho (pull-back, W3): Manager gửi danh sách path,
  // agent stream từng file: FileStart (path/size/sha256) → các đoạn data → FileEnd.
  // Path không đọc được (không tồn tại, lỗi) → sự kiện Missing, không làm hỏng file khác.
  rpc PullFiles(PullRequest) returns (stream PullEvent);
}

message SyncMessage {
  oneof msg {
    FileStart start = 1;
    bytes data = 2;                  // đoạn nội dung của file đang mở (≤ 1MB / đoạn)
    FileEnd end = 3;
    Delete delete = 4;
  }
}

message FileStart {
  string path = 1;                 // tương đối với gốc workspace, đã chuẩn hóa
  int64 size = 2;
  string sha256 = 3;               // agent kiểm lại sau khi nhận đủ
}

message FileEnd {}

message Delete {
  string path = 1;
}

message FileAck {
  enum Op {
    PUT = 0;
    DELETE = 1;
  }
  string path = 1;
  Op op = 2;
  bool ok = 3;
  string sha256 = 4;               // sha thật của file đã ghi
  string error = 5;
}

message SyncReply {
  repeated FileAck acks = 1;
  int64 bytes_written = 2;
  int64 duration_ms = 3;
}

message ListRequest {
  repeated string exclude_dirs = 1; // tên thư mục bỏ qua ở mọi độ sâu (node_modules, .venv...)
  bool with_sha256 = 2;
  int32 limit = 3;                  // 0 = không giới hạn
}

message FileEntry {
  string path = 1;
  int64 size = 2;
  string sha256 = 3;
  int64 mtime_ns = 4;
}

message PullRequest {
  repeated string paths = 1;        // tương đối với gốc workspace, theo thứ tự cần pull
}

message PullEvent {
  oneof event {
    FileStart start = 1;   // tái dùng FileStart: path, size, sha256 (sha TÍNH TRƯỚC từ file thật)
    bytes data = 2;        // đoạn nội dung (≤ 1MB / đoạn)
    FileEnd end = 3;
    Missing missing = 4;
  }
}

message Missing {
  string path = 1;
  string error = 2;
}

message ExecRequest {
  string command = 1;              // chạy bằng `bash -lc`
  string cwd = 2;                  // tương đối với gốc workspace; rỗng = gốc
  map<string, string> env = 3;     // cộng thêm vào môi trường mặc định
  int32 timeout_seconds = 4;       // <= 0 → mặc định của agent
  string request_id = 5;           // ghi log / đối chiếu sổ thao tác
}

message ExecEvent {
  oneof event {
    Output output = 1;
    Exit exit = 2;
  }
}

message Output {
  enum Stream {
    STDOUT = 0;
    STDERR = 1;
  }
  Stream stream = 1;
  bytes data = 2;                  // bytes thô, client tự decode
}

message Exit {
  int32 exit_code = 1;             // -N = bị kill bởi tín hiệu N
  bool timed_out = 2;
  int64 duration_ms = 3;
  string error = 4;                // lỗi trước khi chạy được lệnh (cwd sai...)
}

message HealthRequest {}

message HealthReply {
  string version = 1;
  string workspace_root = 2;
  int64 uptime_ms = 3;
  int32 running = 4;               // số lệnh đang chạy
}
